<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AstroBaba</title>
<meta name="description" content="Western astrology, Vedic astrology, Chinese BaZi and numerology read side by side.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e7dff5'/%3E%3Cpath d='M32 12l5 15 15 5-15 5-5 15-5-15-15-5 15-5z' fill='%238e7cc3'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#fbf8f5; --bg2:#f6f1fb; --card:#ffffff; --ink:#3b3350; --ink2:#6b6382; --line:#ebe4f1;
  --lav:#e7dff5; --lav-d:#8e7cc3; --blush:#fadde4; --blush-d:#c9718a; --mint:#dcf0e6; --mint-d:#5a9a7c;
  --peach:#fde6d5; --peach-d:#c98a55; --sky:#dcebf7; --sky-d:#5f8fb8; --butter:#fbf1cc; --butter-d:#b39a35;
  --radius:20px; --shadow:0 6px 24px rgba(142,124,195,.12);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif; --sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:clamp(16px,4vw,32px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 280px) no-repeat,var(--bg);color:var(--ink);font:400 17px/1.6 var(--sans);min-height:100vh;padding-bottom:84px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0 0 .4em;letter-spacing:.01em}
h1{font-size:clamp(2.1rem,6vw,3.2rem)} h2{font-size:clamp(1.55rem,4vw,2.1rem)} h3{font-size:1.3rem}
p{margin:0 0 .9em} a{color:var(--lav-d)}
.skip{position:absolute;left:-999px} .skip:focus{left:8px;top:8px;background:#fff;padding:8px 12px;border-radius:8px;z-index:99}
:focus-visible{outline:3px solid var(--lav-d);outline-offset:2px;border-radius:8px}
main{max-width:860px;margin:0 auto;padding:8px var(--gut) 40px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:860px;margin:0 auto;padding:16px var(--gut) 8px}
.brand{font:600 1.6rem var(--serif);color:var(--ink);text-decoration:none;letter-spacing:.02em}
.brand-star{color:var(--lav-d)}
.top-nav{display:none;gap:18px;align-items:center}
.top-nav a{color:var(--ink2);text-decoration:none;font-weight:400}
.top-nav a.active{color:var(--ink);font-weight:500}
.top-nav a.btn{color:#fff}
@media(min-width:700px){.top-nav{display:flex}.bottom-nav{display:none!important}body{padding-bottom:20px}}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;font-size:.78rem;color:var(--ink2);text-decoration:none;padding:4px 14px;border-radius:14px;min-width:72px}
.bottom-nav a span{font-size:1.25rem;line-height:1.2}
.bottom-nav a.active{color:var(--lav-d);background:var(--bg2)}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin:0 0 16px;border:1px solid var(--line)}
.card.tint-lav{background:var(--lav)} .card.tint-blush{background:var(--blush)} .card.tint-mint{background:var(--mint)}
.card.tint-peach{background:var(--peach)} .card.tint-sky{background:var(--sky)} .card.tint-butter{background:var(--butter)}
.muted{color:var(--ink2)} .small{font-size:.9rem}
.btn{display:inline-block;background:var(--lav-d);color:#fff;border:0;border-radius:999px;padding:13px 26px;font:500 1rem var(--sans);cursor:pointer;text-decoration:none;box-shadow:0 4px 14px rgba(142,124,195,.3);transition:transform .15s}
.btn:hover{transform:translateY(-1px)} .btn.small{padding:8px 18px;font-size:.92rem;box-shadow:none}
.btn.ghost{background:transparent;color:var(--lav-d);border:1.5px solid var(--lav-d);box-shadow:none}
.btn.danger{background:transparent;color:var(--blush-d);border:1.5px solid var(--blush);box-shadow:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{text-align:center;padding:36px 8px 24px}
.hero p{max-width:34em;margin:0 auto 1.2em;color:var(--ink2);font-size:1.1rem}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:26px 0}
.pillar h3{font-size:1.2rem;margin-bottom:.2em}
.glyph{font-size:1.6rem;display:block;margin-bottom:6px}
label{display:block;font-weight:500;margin:0 0 6px}
input[type=text],input[type=date],input[type=time],input[type=number],select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{border-color:var(--lav-d);outline:none;box-shadow:0 0 0 3px rgba(142,124,195,.2)}
.field{margin-bottom:18px}
.hint{font-size:.88rem;color:var(--ink2);margin-top:5px}
.steps{display:flex;gap:6px;margin:6px 0 20px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--line)} .steps i.on{background:var(--lav-d)}
.choice{display:grid;gap:10px}
.choice label{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;margin:0;background:#fff;font-weight:400}
.choice label:has(input:checked){border-color:var(--lav-d);background:var(--bg2)}
.choice input{margin-top:5px;accent-color:var(--lav-d)}
.choice b{display:block;font-weight:500}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:400 .95rem var(--sans);cursor:pointer;color:var(--ink)}
.chip.on,.chip:hover{border-color:var(--lav-d);background:var(--lav)}
.results{list-style:none;margin:6px 0 0;padding:0;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.results li button{display:block;width:100%;text-align:left;padding:11px 14px;border:0;background:#fff;font:inherit;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
.results li button:hover{background:var(--bg2)}
.picked{background:var(--mint);border-radius:14px;padding:10px 14px;margin-top:8px}
.err{background:var(--blush);color:#7a2e45;border-radius:14px;padding:10px 14px;margin:10px 0}
.snap{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 6px}
.snap div{border-radius:16px;padding:12px 14px}
.snap small{display:block;color:var(--ink2);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em}
.snap b{font:600 1.25rem var(--serif);display:block}
.snap span{font-size:.85rem;color:var(--ink2)}
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:8px;overflow-x:auto;padding:10px var(--gut);margin:0 calc(var(--gut) * -1) 14px;background:rgba(251,248,245,.92);backdrop-filter:blur(8px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font:400 .95rem var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--lav-d);border-color:var(--lav-d);color:#fff}
.block{margin-bottom:14px}
.block h3{margin-bottom:.3em}
.why{margin-top:6px;font-size:.88rem;color:var(--ink2)}
.why summary{cursor:pointer;color:var(--lav-d);width:fit-content}
.why ul{margin:6px 0 0;padding-left:18px}
.badge{display:inline-block;font-size:.75rem;background:var(--butter);color:#6c5c12;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;font-weight:500}
.views .v{border-left:3px solid var(--lav);padding:2px 0 2px 14px;margin:10px 0}
.views .v b{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--lav-d);display:block}
.locked{border:2px dashed var(--lav);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;background:rgba(255,255,255,.6)}
.trait{padding:12px 0;border-bottom:1px solid var(--line)} .trait:last-child{border:0}
.trait h4{font:600 1.2rem var(--serif);margin:0}
.trait .lvl{font-size:.8rem;color:var(--ink2)}
.bars{display:grid;grid-template-columns:70px 1fr;gap:3px 8px;margin-top:6px;font-size:.78rem;color:var(--ink2)}
.bar{height:8px;border-radius:8px;background:var(--line);align-self:center;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.b-z{background:var(--blush-d)} .b-w{background:var(--sky-d)} .b-v{background:var(--peach-d)} .b-n{background:var(--mint-d)}
.list .item{margin:0 0 10px} .list .item b{font-family:var(--serif);font-size:1.12rem}
.note{background:var(--butter);border-radius:14px;padding:12px 16px;font-size:.92rem}
.banner{background:var(--butter);border-radius:16px;padding:12px 16px;margin:12px 0;font-size:.93rem}
.banner ul{margin:6px 0 0;padding-left:18px}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-weight:500;color:var(--ink2);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.scroll-x{overflow-x:auto}
.charts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.charts svg{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
.dasha{display:flex;height:34px;border-radius:12px;overflow:hidden;margin:10px 0 4px}
.dasha div{display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#3b3350;position:relative;min-width:2px}
.dasha .now::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--ink);border-radius:6px}
.numgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.num{border-radius:16px;padding:14px;text-align:center}
.num b{display:block;font:600 2.2rem var(--serif);line-height:1}
.num small{display:block;color:var(--ink2);margin-top:4px}
.score{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:600 1.9rem var(--serif);flex:none;background:conic-gradient(var(--lav-d) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center}
.meter{height:10px;border-radius:10px;background:var(--line);overflow:hidden;margin:4px 0 8px}
.meter i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,var(--lav-d),var(--blush-d))}
.plist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pcard{display:flex;flex-direction:column;gap:6px}
.pcard .meta{color:var(--ink2);font-size:.9rem}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--lav);border-top-color:var(--lav-d);border-radius:50%;animation:s 1s linear infinite;vertical-align:-3px}
@keyframes s{to{transform:rotate(360deg)}}
.foot{max-width:860px;margin:0 auto;padding:10px var(--gut) 100px;color:var(--ink2);font-size:.82rem}
@media(min-width:700px){.foot{padding-bottom:30px}}
.fade{animation:f .35s ease both}@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.pcell{background:var(--bg2);border-radius:16px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:2px}
.pcell small{color:var(--ink2);text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.pcell b{font:600 1.3rem var(--serif)} .pcell span{font-size:.85rem;color:var(--ink2)}
@media print{
  body{background:#fff;padding:0;font-size:12pt}
  .top,.bottom-nav,.tabs,.btn,.row,#print-all,.skip{display:none!important}
  .card{box-shadow:none;break-inside:avoid;border:1px solid #ddd}
  main{max-width:none;padding:0}
  details.why summary{display:none}
  .fade{animation:none}
}

.linkbtn{background:none;border:0;padding:0;color:var(--lav-d);font:inherit;cursor:pointer;text-decoration:underline}
#more-detail{margin:4px 0 14px}

</style>
</head>
<body>

<a class="skip" href="#app">Skip to content</a>
<header class="top">
  <a class="brand" href="#/" aria-label="AstroBaba home"><span class="brand-star" aria-hidden="true">✦</span> AstroBaba</a>
  <nav class="top-nav" aria-label="Main">
    <a href="#/" data-nav="home">Profiles</a>
    <a href="#/compare" data-nav="compare">Compare</a>
    <a href="#/new" class="btn small" data-nav="new">New profile</a>
  </nav>
</header>
<main id="app" tabindex="-1"></main>
<nav class="bottom-nav" aria-label="Main (mobile)">
  <a href="#/" data-nav="home"><span aria-hidden="true">☉</span>Profiles</a>
  <a href="#/new" data-nav="new"><span aria-hidden="true">＋</span>New</a>
  <a href="#/compare" data-nav="compare"><span aria-hidden="true">♡</span>Compare</a>
</nav>
<footer class="foot">
  <p id="disclaimer"></p>
  <p>Your birth details are saved only in this browser. Everything is calculated on your device; place suggestions use the free Open-Meteo service when online, with a built-in city list offline.</p>
</footer>

<script>/* data.js */
/* Generated by tools/build_js_data.py. Do not edit. */
globalThis.ABDATA = {"SIGN_TEXT":{"Aries":{"kw":["bold","direct","pioneering"],"sun":"You are built to begin things. Courage, directness and a need for momentum define you; you would rather act and adjust than wait for certainty.","moon":"You feel fast and physically. You need room to react, a way to burn off tension, and people who don't treat a flare-up as a final verdict.","rising":"You come across as direct, energetic and ready. People sense you're someone who will actually do the thing.","venus":"You love with enthusiasm and pursue what excites you. You value honesty, spark and being chosen openly rather than slowly.","mars":"Your drive is immediate and competitive. You work best with clear goals, fast feedback and ownership of the result.","mercury":"Your mind is quick, blunt and decisive. You think while speaking and dislike over-explaining.","career":"Roles with autonomy, speed and visible results: founding or launching things, sales, sport and coaching, emergency or frontier work.","hobbies":"Active or competitive pursuits: martial arts, running, climbing, team sports, building or fixing things with your hands.","partner":"You tend to be drawn to partners who are bold, independent and unafraid of friction.","node":"Growth comes from acting on your own behalf: starting without consensus, naming what you want, and tolerating the discomfort of being the one who chose."},"Taurus":{"kw":["steady","sensual","loyal"],"sun":"You are grounded, patient and quietly determined. You build slowly, value what lasts, and trust what you can see, touch and test.","moon":"You need security, routine comfort and sensory ease: good food, a calm home, familiar people. Rushing or sudden change unsettles you more than you show.","rising":"You come across as calm, solid and unhurried. People find you reassuring, sometimes immovable.","venus":"You love through loyalty, touch and consistency. You value reliability and shared comforts, and you commit deeply once trust is earned.","mars":"Your drive is slow to start and hard to stop. You work best at a sustainable pace on things that produce tangible results.","mercury":"You think carefully and practically. You form opinions slowly and hold them firmly; you'd rather get it right than get it fast.","career":"Work that produces something tangible or sustains people: craft and design, finance and property, food and hospitality, agriculture, long-term management.","hobbies":"Gardening, cooking, music, art and craft, nature walks, collecting, anything that rewards patience and the senses.","partner":"You tend to be drawn to partners who feel stable, warm and dependable, sometimes at the cost of excitement.","node":"Growth comes from slowing down and building something lasting: valuing yourself and your own resources rather than living in constant crisis or intensity."},"Gemini":{"kw":["curious","quick","versatile"],"sun":"You are curious, adaptable and verbal. Your energy runs on variety, conversation and learning, and you connect ideas that others keep separate.","moon":"You process feelings by talking, writing or analysing them. You need mental stimulation and people to bounce thoughts off; silence and routine can feel flat.","rising":"You come across as lively, articulate and approachable. People read you as quick and interested in them.","venus":"You love through conversation and play. You value wit, shared curiosity and freedom to be many things in one relationship.","mars":"Your drive is scattered but fast. You work best on several things at once, with variety and short feedback loops.","mercury":"Your mind is agile, associative and language-loving. You absorb quickly and communicate easily, though depth can lag behind speed.","career":"Work built on communication and variety: writing, teaching, media, marketing, technology, trade, consulting, anything with many contacts.","hobbies":"Reading, writing, podcasts, languages, puzzles, travel in short bursts, social clubs, learning new tools.","partner":"You tend to be drawn to partners who are witty, flexible and mentally engaging.","node":"Growth comes from curiosity over certainty: asking questions, learning from everyday people and staying open instead of committing early to one big truth."},"Cancer":{"kw":["nurturing","protective","intuitive"],"sun":"You are sensitive, protective and deeply loyal. You read the emotional weather of a room instantly and build a sense of home wherever you go.","moon":"You need emotional safety above almost everything: familiar people, a retreat space, and reassurance that you belong. When hurt you withdraw into a shell first.","rising":"You come across as gentle, careful and caring. People often feel safe with you before they know why.","venus":"You love by caring, feeding, remembering and protecting. You value emotional loyalty and a shared sense of home and history.","mars":"Your drive is indirect and mood-sensitive. You work best when you feel emotionally secure and your effort protects someone or something you care about.","mercury":"You think through feeling and memory. You pick up on tone and subtext brilliantly, and you remember what people said long after they've forgotten.","career":"Work that cares for or nurtures: healthcare and counselling, education, hospitality, family business, real estate and home, community or support roles.","hobbies":"Cooking and hosting, home projects, family history, gardening, swimming and water, comfort-reading, caring for animals.","partner":"You tend to be drawn to partners who feel emotionally warm and home-making, and who offer safety.","node":"Growth comes from emotional openness: letting yourself be nurtured, building belonging, and being less defensively self-reliant."},"Leo":{"kw":["warm","proud","generous"],"sun":"You are warm, expressive and big-hearted. You light up rooms and need to create, lead or be recognised for something that is truly yours.","moon":"You need to feel appreciated and to be able to express yourself fully. Being ignored or belittled hurts more than you admit; praise genuinely restores you.","rising":"You come across as confident, warm and a little dramatic in a good way. People notice you when you enter.","venus":"You love generously and romantically. You value loyalty, admiration and grand gestures, and you give as much as you hope to receive.","mars":"Your drive is proud and sustained. You work best when the work is meaningful, visible, and gives you a stage or a team to lead.","mercury":"You think in stories and big pictures. You communicate with conviction and flair, and speak best when you believe in your subject.","career":"Roles with visibility and creative leadership: management, performance, design, entertainment, education, entrepreneurship, public-facing work.","hobbies":"Performing, creative arts, hosting, sports, fashion, children and play, anything that lets you express and be seen.","partner":"You tend to be drawn to partners who are admirable, charismatic and loyal.","node":"Growth comes from sharing the spotlight on your own terms: creating from the heart and trusting that your authentic expression is enough."},"Virgo":{"kw":["analytical","helpful","precise"],"sun":"You are observant, practical and quietly capable. You notice what could be better and you naturally improve things, often without being asked.","moon":"You manage feelings by organising and fixing. You need order, useful work and time alone to reset; worry is your reflex when things feel uncertain.","rising":"You come across as neat, thoughtful and a little reserved. People assume you are competent, and usually they are right.","venus":"You love through acts of service and attention to detail. You value honesty, usefulness and growth, and you show affection by solving problems.","mars":"Your drive is methodical and efficient. You work best with clear standards, systems to refine and a sense of doing something properly.","mercury":"Your mind is analytical, discerning and detail-oriented. You spot errors and patterns quickly, and you communicate precisely.","career":"Work that rewards accuracy and service: analysis, research, healthcare, editing, engineering, operations, quality, craftsmanship.","hobbies":"Gardening, cooking, fitness routines, crafts, puzzles, volunteering, organising, learning technical skills.","partner":"You tend to be drawn to partners who are dependable, intelligent and self-improving.","node":"Growth comes from practical service and healthy routines: attending to details and daily habits instead of drifting in idealism or avoidance."},"Libra":{"kw":["diplomatic","fair","aesthetic"],"sun":"You are gracious, fair-minded and relationship-oriented. You see every side of a situation and seek balance, beauty and cooperation.","moon":"You need harmony, companionship and a pleasant environment. Conflict drains you, and you can lose track of your own feelings while managing everyone else's.","rising":"You come across as charming, polite and easy to be around. People feel considered by you.","venus":"You love through partnership, romance and shared aesthetics. You value fairness, grace and being a true team.","mars":"Your drive works best in partnership. You tend to weigh options before acting and perform well when collaborating or advocating for fairness.","mercury":"Your mind weighs, compares and mediates. You communicate diplomatically and see multiple perspectives, which can slow decisions.","career":"Work that blends people and aesthetics or fairness: law and mediation, design, HR, diplomacy, client relations, arts, partnerships.","hobbies":"Art and design, music, social events, dance, fashion, couples activities, galleries and travel with company.","partner":"You tend to be drawn to partners who are decisive, passionate and willing to lead, which balances your own deliberation.","node":"Growth comes from true partnership: learning to collaborate, compromise gracefully and value other people's perspectives alongside your own drive."},"Scorpio":{"kw":["intense","perceptive","private"],"sun":"You are intense, perceptive and resilient. You want what is real and look beneath the surface of everything, including yourself.","moon":"You feel deeply and privately. You need trust, loyalty and emotional honesty; once betrayed, you rarely forget. You protect yourself by controlling what you reveal.","rising":"You come across as magnetic, composed and slightly mysterious. People sense depth, and often some intensity, before you say anything.","venus":"You love all-in or not at all. You value loyalty, intimacy and truth, and you are drawn to bonds that transform you.","mars":"Your drive is focused and relentless. You work best on something that matters, with full control over how deeply you can dig.","mercury":"Your mind investigates. You read motives, notice what isn't said, and prefer depth to small talk.","career":"Work that looks beneath the surface or deals with crisis and transformation: research, psychology, investigation, finance, medicine, strategy, crisis management.","hobbies":"Mystery and research, deep reading, psychology, swimming, strength training, secretive passion projects, film and storytelling.","partner":"You tend to be drawn to partners who are loyal, emotionally brave and capable of depth.","node":"Growth comes from emotional honesty and shared resources: allowing real intimacy and letting things transform instead of clinging to comfort."},"Sagittarius":{"kw":["adventurous","optimistic","philosophical"],"sun":"You are optimistic, honest and freedom-loving. You are driven by meaning, exploration and the search for a bigger picture.","moon":"You need space, adventure and a sense of purpose. You feel stifled by routine and by people who need constant reassurance; humour and movement restore you.","rising":"You come across as friendly, open and enthusiastic. People see someone who is up for things.","venus":"You love through shared adventure and honesty. You value freedom, growth and a partner who is also a friend and fellow explorer.","mars":"Your drive is enthusiastic and big-picture. You work best on expansive goals with room to roam and a mission that matters.","mercury":"Your mind seeks meaning and the big idea. You communicate frankly, sometimes bluntly, and love to teach and debate.","career":"Work with scope and meaning: teaching, publishing, travel, international business, law, coaching, outdoor or philosophical fields.","hobbies":"Travel, hiking, sports, languages, philosophy and religion, outdoor adventure, storytelling.","partner":"You tend to be drawn to partners who are adventurous, worldly and unpossessive.","node":"Growth comes from pursuing meaning and wider horizons: trusting a bigger picture rather than staying in the comfortable details."},"Capricorn":{"kw":["ambitious","responsible","disciplined"],"sun":"You are responsible, ambitious and patient. You plan for the long haul and take quiet pride in earning results the slow, solid way.","moon":"You hold emotions in and stay composed. You need respect, structure and a sense of progress; you often carry more than you ask others to help with.","rising":"You come across as serious, capable and self-contained. People see someone who can be relied on.","venus":"You love slowly and seriously. You value commitment, shared goals and dependability, and you show affection through effort and provision.","mars":"Your drive is disciplined and strategic. You work best with a clear ladder, long-term goals and real responsibility.","mercury":"Your mind is practical, structured and strategic. You speak sparingly and weigh consequences before committing.","career":"Work that builds or runs structures: management, finance, engineering, government, law, operations, entrepreneurship, anything with a clear path of mastery.","hobbies":"Hiking and climbing, woodwork, history, strategy games, learning a craft or instrument slowly, investing and planning.","partner":"You tend to be drawn to partners who are mature, accomplished and steady.","node":"Growth comes from building a structure of your own: taking responsibility and leadership instead of leaning on others' care."},"Aquarius":{"kw":["original","independent","humanitarian"],"sun":"You are independent, inventive and idealistic. You think for yourself, care about the collective, and feel most alive when ideas can change something.","moon":"You need intellectual freedom and room to be different. You often process emotion at a distance; closeness works best when it feels like friendship first.","rising":"You come across as friendly yet somewhat detached and unconventional. People find you interesting and hard to categorise.","venus":"You love through friendship, shared ideals and independence. You value honesty, originality and a partner who gives you room.","mars":"Your drive is idea-led and group-oriented. You work best on projects that are innovative and that serve more than yourself.","mercury":"Your mind is original and systems-oriented. You see patterns and future possibilities, and you can be stubborn about your opinions.","career":"Work that innovates or serves groups: technology, science, social causes, design, community building, media, anything that improves a system.","hobbies":"Tech and tinkering, volunteering, clubs and communities, futuristic fiction, astronomy, unusual collections, causes you believe in.","partner":"You tend to be drawn to partners who are unconventional, intelligent and independent.","node":"Growth comes from contributing to the group and letting your uniqueness serve others, rather than seeking applause for your personal drama."},"Pisces":{"kw":["compassionate","imaginative","intuitive"],"sun":"You are compassionate, imaginative and absorbent. You sense moods and meanings others miss, and you live partly in an inner world of images and feelings.","moon":"You absorb the feelings around you and need solitude, creativity and rest to clear them. Boundaries are essential and can be hard to hold.","rising":"You come across as soft, dreamy and gentle. People feel understood by you, sometimes before you've said much.","venus":"You love unconditionally and romantically. You value emotional and spiritual connection and may overlook flaws, or give more than you receive.","mars":"Your drive is fluid and inspiration-led. You work best on work that feels meaningful, with flexibility and without harsh pressure.","mercury":"Your mind is intuitive and associative. You think in images and impressions and communicate through metaphor, story and feeling.","career":"Work that serves, creates or heals: arts and music, counselling and care, spiritual work, film, charity, research that rewards intuition.","hobbies":"Music, painting, writing, photography, swimming, meditation, dance, volunteering, anything immersive.","partner":"You tend to be drawn to partners who feel romantic, protective and spiritually deep, so check for steadiness as well as magic.","node":"Growth comes from trusting intuition and compassion over analysis: allowing faith, rest and imagination to guide you."}},"TRAITS":{"initiative":{"name":"Initiative","title":"The Pioneer","tag":"You start things and move first.","strength":"You act when others hesitate. You break inertia, take the first risk and give projects, and people, their starting energy.","watch":"Impatience and an appetite for the new can leave unfinished things behind you, and your speed can feel like pressure to people who think more slowly.","develop":"Practise starting small: pick one thing, take one action today, and tolerate the awkwardness of not knowing yet.","career":"Entrepreneurship, sales, leadership of new initiatives, sport and coaching, emergency or frontier roles, startups.","work":"You work in bursts of intense drive, need autonomy, and dislike heavy approval chains.","hobbies":"Competitive sport, martial arts, running, climbing, building projects, anything with a clear challenge.","love":"You love directly and with energy. You show interest openly and want a partner who meets you rather than plays games.","seek":"Someone secure enough to hold their ground without a fight, who can match your energy, say what they want plainly, and give you some room.","avoid":"Partners who need constant reassurance, or who are passive-aggressive: both leave you pushing alone. Also watch for turning every disagreement into a contest.","stress":"Stress shows up as irritability and rushing. Reset with vigorous movement first, then talk.","money":"You take financial risks readily and earn well from initiative; build a buffer so bold moves don't become desperate ones.","gives":"decisiveness, courage and a spark that gets things moving"},"steadiness":{"name":"Steadiness","title":"The Anchor","tag":"You are patient, loyal and hard to shake.","strength":"You are reliable and persistent. You follow through, keep calm when others panic, and make things last.","watch":"Stubbornness and attachment to the familiar can keep you in situations, habits or relationships long past their usefulness.","develop":"Build consistency with tiny daily routines, and let promises be small enough that you can always keep them.","career":"Finance, property, craft, healthcare, agriculture, operations, long-term management: places that value dependability.","work":"You work at a steady pace and finish what you start, but you resist abrupt change and shifting priorities.","hobbies":"Gardening, cooking, music, crafts, nature, collecting, slow, sensory hobbies.","love":"You love through loyalty, touch and consistency. Affection is shown in what you do every week, not in speeches.","seek":"A partner who values stability and shows up reliably, who can be patient with your pace, and who shares your idea of comfort and home.","avoid":"Chaotic or unreliable partners drain you, and so does staying loyal to someone who isn't loyal back. Beware of confusing familiarity with fit.","stress":"Stress shows up as digging in and getting rigid. Reset with routine, good food, time outdoors and physical comfort.","money":"You save well and prefer tangible assets. Check that caution doesn't become hoarding or fear of reasonable risk.","gives":"calm, loyalty and a sense of home"},"curiosity":{"name":"Curiosity","title":"The Curious Mind","tag":"You learn fast and connect ideas and people.","strength":"You pick things up quickly, explain them well, and see links others miss. You are adaptable and good at keeping a conversation and a team moving.","watch":"Scattered attention, restlessness and surface-level knowing: starting many things, finishing few, and talking yourself out of feelings.","develop":"Choose one topic to go deep on for 30 days, and practise listening to the end of a sentence before answering.","career":"Writing, teaching, media, marketing, technology, consulting, trade, journalism, roles with variety and information flow.","work":"You work best with variety, short cycles and people to bounce ideas with; routine and silence kill your energy.","hobbies":"Reading, podcasts, languages, puzzles, short trips, social clubs, learning new tools and skills.","love":"You love through conversation, humour and shared discovery. Mental connection is the doorway to emotional connection.","seek":"Someone who is a real conversation partner, curious about you and the world, flexible, and comfortable with your need for variety.","avoid":"Partners who are rigid, silent in conflict or intellectually incurious. Watch for staying in your head to avoid feelings.","stress":"Stress shows up as overthinking, scattered focus and nervous energy. Reset by writing everything out, then walking.","money":"You can earn in several ways. Keep records, since variety can mean untracked spending and income.","gives":"liveliness, conversation and a flexible mind"},"empathy":{"name":"Empathy","title":"The Feeler","tag":"You sense what others feel and you protect what you love.","strength":"You read people accurately, make others feel safe, and create belonging. Your loyalty and care are genuine and deep.","watch":"Taking on other people's moods, over-protecting, and withdrawing when hurt instead of saying what happened. Memory for old hurts can keep wounds open.","develop":"Practise naming your own feelings before you check others', and set one small boundary this week without apologising.","career":"Counselling, healthcare, teaching, hospitality, family or community businesses, real estate and home, support and care roles.","work":"You work best where you feel emotionally safe and your effort helps someone; harsh or competitive cultures wear you down.","hobbies":"Cooking and hosting, home projects, gardening, family history, animals, being near water, comfort reading.","love":"You love by caring, remembering and protecting. You want an emotional home with the person you love.","seek":"A partner who is emotionally open and consistent, who can hear a need without defensiveness, and who treats your sensitivity as a strength.","avoid":"Emotionally unavailable, critical or volatile partners, and any relationship where you are the only one doing the caring. Beware of rescuing.","stress":"Stress shows up as withdrawal, moodiness and comfort-seeking. Reset with a safe space, a warm meal and time with someone who asks nothing of you.","money":"You spend generously on loved ones and home. Protect a personal savings line so care for others never drains your own security.","gives":"warmth, emotional safety and attentiveness"},"radiance":{"name":"Radiance","title":"The Radiant One","tag":"You are warm, expressive and meant to be seen.","strength":"You bring warmth, confidence and creative energy. People feel encouraged around you, and you lead naturally by example.","watch":"Needing applause, taking criticism as rejection, and pride that will not bend. You can overextend to keep your image intact.","develop":"Do one thing a week for its own sake, unseen. Practise offering praise, and accepting feedback without defending.","career":"Leadership, performance, creative direction, teaching, entertainment, design, entrepreneurship, public-facing roles.","work":"You work best with a stage, a team to lead and work you care about; you lose heart in thankless backrooms.","hobbies":"Performing, creative arts, hosting, sports, fashion, play with children, anything expressive.","love":"You love generously and romantically. You give a lot and you light up when your partner is proud of you.","seek":"A partner who admires you sincerely, is secure enough to share the spotlight, and is honest when you need grounding.","avoid":"Partners who belittle or ignore you, and flatterers who only reflect your image. Watch for drama as a way to feel seen.","stress":"Stress shows up as wounded pride or a need for reassurance. Reset by creating something and by giving to someone else.","money":"You enjoy spending on quality and generosity. Put some budget on autopilot so image-spending doesn't outrun income.","gives":"warmth, loyalty and joyful energy"},"precision":{"name":"Precision","title":"The Refiner","tag":"You notice details and make things work better.","strength":"You are observant, practical and conscientious. You spot problems early, improve systems, and take pride in doing things properly.","watch":"Self-criticism, worry and fault-finding, aimed at yourself first and others second. Perfectionism can delay action.","develop":"Set a 'good enough' standard before starting a task, and finish at that standard once.","career":"Analysis, research, healthcare, editing, engineering, operations, quality and compliance, craftsmanship, data work.","work":"You work methodically, enjoy fixing and improving, and do best with clear standards and quiet focus.","hobbies":"Gardening, cooking, fitness routines, crafts, puzzles, organising, learning technical skills, volunteering.","love":"You love through useful acts and attention. You notice what your partner needs and quietly provide it.","seek":"A partner who appreciates your care, communicates directly, is reasonably organised, and reassures you that you are enough as you are.","avoid":"Careless or chaotic partners who fuel your worry, and critical partners who amplify your inner critic. Watch for fixing people who didn't ask.","stress":"Stress shows up as worry, nitpicking and tension in the body. Reset with a routine, a walk, and writing a short to-do list.","money":"You budget carefully and spot waste. Allow some money to be for enjoyment, not only for security.","gives":"reliability, thoughtfulness and practical help"},"harmony":{"name":"Harmony","title":"The Peacemaker","tag":"You balance, mediate and bring people together.","strength":"You are diplomatic, fair and gracious. You see all sides, ease tension and make partnerships and teams work.","watch":"People-pleasing, indecision, and avoiding necessary conflict. You can lose your own preferences while balancing everyone else's.","develop":"State a preference before you ask for others', and practise saying a clear 'no' in low-stakes situations.","career":"Mediation, law, HR, design, diplomacy, client relations, arts, partnerships and team-based work.","work":"You work best in pairs or teams, in pleasant environments, with a role that values fairness.","hobbies":"Art and design, music, social events, dance, galleries, couple and group activities.","love":"You love through partnership and romance. You care about fairness, beauty and being a true team.","seek":"A partner who is direct about needs, willing to decide, and who treats you as an equal and not as the peacekeeper.","avoid":"Domineering partners who exploit your flexibility, and conflict-avoidant partners who leave issues unspoken. Watch for resentment building quietly.","stress":"Stress shows up as indecision and avoidance. Reset with beauty, calm company and a small decision made quickly.","money":"You like shared finances and enjoy nice things. Agree on shared money rules early to avoid silent friction.","gives":"grace, fairness and a talent for peace"},"intensity":{"name":"Intensity","title":"The Deep Diver","tag":"You go beneath the surface and don't do things halfway.","strength":"You are resilient, perceptive and focused. You see motives, stay in a crisis, and transform difficulty into strength.","watch":"Control, secrecy and holding grudges. All-or-nothing thinking can turn trust issues into tests people can't pass.","develop":"Practise sharing one honest feeling a week before you need to, and let small things be small.","career":"Research, psychology, investigation, finance, medicine, strategy, crisis management, any work that rewards depth.","work":"You work with fierce focus on what matters and have little patience for superficial tasks.","hobbies":"Deep reading, psychology and mystery, strength training, swimming, film, secret passion projects.","love":"You love all-in or not at all. Intimacy, loyalty and truth are non-negotiable, and you bond deeply.","seek":"Someone emotionally brave and honest, who stays steady in a storm and who doesn't treat your depth as a problem.","avoid":"Partners who are evasive or unfaithful, and those who need constant lightness. Watch for testing people or controlling out of fear.","stress":"Stress shows up as brooding, suspicion and withdrawal. Reset with intense physical exertion and one honest conversation.","money":"You are strategic and private about money and good at investments and shared resources. Be transparent with partners.","gives":"loyalty, depth and emotional courage"},"exploration":{"name":"Exploration","title":"The Seeker","tag":"You chase meaning, freedom and the bigger picture.","strength":"You are optimistic, honest and inspiring. You see possibility, teach naturally and help people lift their horizons.","watch":"Overpromising, restlessness, bluntness and avoiding commitment dressed up as freedom.","develop":"Commit to one long project with a fixed finish date, and practise asking 'what does this person need?' before offering your view.","career":"Teaching, publishing, travel, international business, law, coaching, outdoor and philosophy-oriented work.","work":"You work best with scope, a mission and room to roam; micromanagement and routine are your enemies.","hobbies":"Travel, hiking, sport, languages, philosophy, outdoor adventure, storytelling.","love":"You love through shared adventure and honesty. Your partner should also be your friend and fellow explorer.","seek":"A partner who has their own interests, supports your freedom and growth, and wants to travel life with you rather than hold you in place.","avoid":"Possessive or controlling partners, and equally partners who cannot commit. Watch for leaving at the first sign of boredom.","stress":"Stress shows up as restlessness and escapism. Reset with time outdoors, movement and a change of scenery.","money":"You are generous and optimistic with money, and sometimes careless. Automate savings so optimism doesn't become overreach.","gives":"optimism, humour and a sense of adventure"},"discipline":{"name":"Discipline","title":"The Builder","tag":"You plan, persist and earn mastery.","strength":"You are responsible and strategic. You think long term, handle pressure calmly and build things that last.","watch":"Overwork, emotional reserve, pessimism and a harsh inner judge. You can postpone life until you've 'earned' it.","develop":"Schedule small, regular wins and rest as seriously as you schedule work; define 'enough' in advance.","career":"Management, finance, engineering, government, law, operations, entrepreneurship, any role with a path of mastery.","work":"You work steadily toward long-term goals, take responsibility readily, and respect competence and structure.","hobbies":"Hiking and climbing, woodwork, history, strategy games, mastering an instrument or craft, investing.","love":"You love slowly and seriously. You show commitment through effort, provision and being there for the long term.","seek":"A partner who respects your goals, shares responsibility, and gently pulls you out of work mode into play and feeling.","avoid":"Partners who are unreliable with money or promises, and relationships where you play the parent. Watch for replacing intimacy with productivity.","stress":"Stress shows up as overwork, tension and emotional shutdown. Reset with a hard stop to the day, exercise and a genuine day off.","money":"You build wealth steadily and plan well. Make sure your money also funds joy and relationships.","gives":"stability, commitment and a plan"},"originality":{"name":"Originality","title":"The Innovator","tag":"You think differently and care about the bigger system.","strength":"You are inventive, principled and independent. You see future possibilities, challenge stale assumptions and care about fairness for many.","watch":"Detachment, contrarianism and stubbornness. Emotional distance can make close people feel unseen.","develop":"Practise staying with one feeling for five minutes, and test your idea with one person who disagrees before declaring it right.","career":"Technology, science, social causes, design, community building, media, anything that improves a system.","work":"You work best on innovative or group-minded projects with freedom of method; rigid hierarchy and repetition stifle you.","hobbies":"Tinkering, tech, volunteering, communities, futuristic fiction, astronomy, unusual collections, causes.","love":"You love through friendship and shared ideals. You need independence, and you show care through loyalty, ideas and respect.","seek":"A partner who is also a friend, who gives you room, who is open-minded, and who will gently ask for the emotional closeness you don't offer unprompted.","avoid":"Clingy or highly conventional partners who make you feel boxed in, and partners who dismiss your ideals. Watch for going cold when feelings arrive.","stress":"Stress shows up as withdrawal and emotional detachment. Reset with time alone, a project you care about, and then reaching out.","money":"You are unconventional with money and may earn through innovation. Keep a simple system for the basics.","gives":"honesty, originality and respect for your freedom"},"imagination":{"name":"Imagination","title":"The Dreamer","tag":"You feel, intuit and create beyond the obvious.","strength":"You are compassionate, creative and intuitive. You sense atmosphere, imagine alternatives and comfort others without being asked.","watch":"Escapism, absorbing other people's pain, vague boundaries and avoiding hard practical decisions.","develop":"Anchor your inspiration with one concrete routine, and write down decisions so intuition has a structure to land in.","career":"Arts, music, film, counselling, healing, spiritual work, charity, writing, design, research that rewards intuition.","work":"You work in waves of inspiration and need meaning and flexibility; harsh deadlines and conflict drain you.","hobbies":"Music, painting, writing, photography, swimming, meditation, dance, anything immersive.","love":"You love unconditionally and romantically, seeking a soul-level bond. You give a lot and may idealise.","seek":"A grounded, kind partner who respects your sensitivity and gives structure and honest feedback, not just romance.","avoid":"Partners who exploit your compassion, or addictions and instability you feel you can fix. Watch for loving the potential rather than the person.","stress":"Stress shows up as fog, escapism and overwhelm. Reset with solitude, water, creative time, and rest.","money":"You are generous and can be vague about money. Use simple automated systems and a trusted second opinion on big decisions.","gives":"tenderness, creativity and spiritual depth"},"introspection":{"name":"Introspection","title":"The Observer","tag":"You look inward, analyse and seek truth quietly.","strength":"You are thoughtful, discerning and self-aware. You research deeply, notice patterns and bring clarity when others react.","watch":"Isolation, over-analysis and guardedness. People may read your silence as distance when it is concentration.","develop":"Schedule one regular social contact and share a thought before you've finished perfecting it.","career":"Research, analysis, science, writing, philosophy, spirituality, technology, specialist advisory roles.","work":"You work best alone or in small, quiet teams, with time to think and a chance to master a subject.","hobbies":"Reading, research, meditation, nature, chess and strategy games, writing, solitary study.","love":"You love privately and thoughtfully. Trust comes slowly, and when you give it, you give it fully.","seek":"A patient partner who gives you solitude without taking it personally, who is intellectually engaging, and who gently draws you out.","avoid":"Intrusive or highly social-demanding partners who can't give you space, and partners who read quiet as rejection. Watch for withdrawing instead of speaking.","stress":"Stress shows up as isolation and mental loops. Reset with quiet time alone, nature, and then one real conversation.","money":"You research before spending and prefer simple, durable choices. Allow some money to be for connection and joy.","gives":"depth, loyalty and calm perspective"}},"TENSIONS":{"initiative|harmony":"Push and peace: part of you wants to act first and decide quickly, part of you wants everyone comfortable. Notice which voice shows up under pressure, and name your preference early.","steadiness|exploration":"Roots and wings: you crave security and also freedom. This is not a flaw; build a stable base that includes planned adventure.","radiance|introspection":"Spotlight and solitude: you are warm and expressive, yet need time alone. Expect to alternate, and protect recovery time after being 'on'.","discipline|imagination":"Structure and dreaming: you have both a planner and a dreamer. Give each its own time block so one doesn't sabotage the other.","precision|imagination":"Analysis and intuition: you can dissect everything, yet you also feel your way. Use intuition to generate and analysis to check, not the other way round.","originality|steadiness":"Change and constancy: you value stability and also the new. Try changing one variable at a time.","intensity|harmony":"Depth and diplomacy: you feel strongly yet avoid conflict, so feelings can build behind a calm face. Speak small truths early.","empathy|originality":"Closeness and detachment: you crave connection and also distance. Tell the people close to you which mode you're in."},"NUMBERS":{"1":{"title":"The Leader","core":"independence, initiative and self-reliance. The lesson is standing on your own feet without pushing others away.","strength":"originality, courage and drive to lead","watch":"stubbornness, impatience and going it alone","career":"founding, leading, anything where you can steer","love":"You need a partner who respects your independence and is confident enough not to compete.","year":"A year of new beginnings. Plant seeds, start what you've been postponing, and take initiative. Decisions made now set a nine-year pattern."},"2":{"title":"The Peacemaker","core":"cooperation, sensitivity and partnership. The lesson is balancing care for others with your own needs.","strength":"diplomacy, patience and intuition for people","watch":"over-sensitivity, indecision and dependency","career":"mediation, counselling, partnerships, support and design roles","love":"You thrive with a gentle, loyal partner and need to say what you need aloud.","year":"A year of patience, partnerships and listening. Not a year to force outcomes; nurture relationships and let things ripen."},"3":{"title":"The Communicator","core":"creative self-expression, joy and connection. The lesson is committing your gifts rather than scattering them.","strength":"creativity, charm and optimism","watch":"scattered energy, avoiding depth, and mood swings","career":"writing, performing, teaching, marketing, design","love":"You need fun, appreciation and conversation, and a partner who can handle your moods without criticising them.","year":"A year for creativity, socialising and expression. Say yes to invitations, create openly, and avoid overextending."},"4":{"title":"The Builder","core":"order, hard work and foundations. The lesson is to be flexible while building something lasting.","strength":"reliability, discipline and practical skill","watch":"rigidity, workaholism and fear of change","career":"engineering, management, finance, trades, operations","love":"You show love through steadiness and need a partner who values loyalty and shares responsibilities.","year":"A year of foundations and effort. Organise, budget, train and build. The results may be slow but they last."},"5":{"title":"The Adventurer","core":"freedom, change and experience. The lesson is using freedom with purpose, not as an escape from commitment.","strength":"adaptability, curiosity and magnetism","watch":"restlessness, overindulgence and inconsistency","career":"travel, sales, media, entrepreneurship, anything dynamic","love":"You need variety, space and a partner who is also an adventure.","year":"A year of change, travel and unexpected turns. Stay flexible, take a considered risk, and avoid impulsive decisions."},"6":{"title":"The Nurturer","core":"responsibility, care and harmony in relationships and home. The lesson is caring without controlling or self-sacrificing.","strength":"compassion, dependability and a sense of beauty","watch":"over-responsibility, perfectionism and meddling","career":"teaching, healthcare, design, counselling, hospitality, community roles","love":"You are devoted and family-minded, and need to receive care as well as give it.","year":"A year centred on home, family, love and responsibility. Commitments deepen; balance giving with your own needs."},"7":{"title":"The Seeker","core":"analysis, wisdom and inner life. The lesson is trusting others and sharing what you know.","strength":"insight, depth and independent thought","watch":"isolation, scepticism and secrecy","career":"research, science, writing, analysis, spiritual or technical specialisms","love":"You need space, intellectual connection and a partner who accepts your quiet.","year":"A year for reflection, study and rest. Slow down, learn, and review your direction. Not the time for forcing big external moves."},"8":{"title":"The Powerhouse","core":"achievement, authority and material mastery. The lesson is using power with integrity and balance.","strength":"ambition, organisation and resilience","watch":"workaholism, control and equating worth with status","career":"business, finance, management, law, real estate","love":"You need a partner who respects your ambition and can be an equal, and who reminds you to rest.","year":"A year of results, money and recognition. Reap what you've built, take authority, and be careful with ego and overwork."},"9":{"title":"The Humanitarian","core":"compassion, completion and a wider view. The lesson is letting go, and giving without needing return.","strength":"generosity, wisdom and breadth of vision","watch":"martyrdom, detachment and clinging to the past","career":"teaching, healing, arts, charity, global or social causes","love":"You love widely and need a partner who shares your values and lets you grow.","year":"A year of endings and clearing. Release what is finished, forgive, finish projects, and prepare for a new cycle."},"11":{"title":"The Illuminator","core":"intuition, inspiration and heightened sensitivity. A master number: the lesson is grounding a vivid inner life in practical action.","strength":"insight, vision and the ability to inspire","watch":"nervous tension, self-doubt and unrealistic expectations","career":"teaching, the arts, counselling, spiritual or creative leadership","love":"You need a deep, sensitive connection and a calm partner who steadies your nerves.","year":""},"22":{"title":"The Master Builder","core":"large-scale practical vision. A master number: the lesson is turning big ideas into real, lasting structures.","strength":"vision with discipline, leadership and execution","watch":"pressure, perfectionism and overwhelm","career":"large projects, architecture, organisations, global business","love":"You need a partner who supports your ambition and also anchors you in everyday life.","year":""},"33":{"title":"The Master Teacher","core":"compassionate service and teaching through example. A master number: the lesson is caring without self-sacrifice.","strength":"healing presence, devotion and inspiration","watch":"over-giving, burnout and a martyr streak","career":"teaching, healing, ministry, community leadership, creative service","love":"You love selflessly and must learn to receive and to keep boundaries.","year":""}},"KARMIC_DEBT":{"13":"Karmic Debt 13: a pattern around effort and laziness. The invitation is steady, focused work, and not taking shortcuts or giving up when it gets tedious.","14":"Karmic Debt 14: a pattern around freedom and excess. The invitation is moderation, commitment and using your freedom responsibly.","16":"Karmic Debt 16: a pattern around ego and sudden collapse. The invitation is humility, and rebuilding on something more genuine after setbacks.","19":"Karmic Debt 19: a pattern around independence and power. The invitation is accepting help, and using strength in service of others."},"CATEGORY_INTRO":{"life_path":"Your Life Path is {n}: the main road you walk. It centres on {core}","expression":"Your Expression number is {n}: how you naturally act in the world. It speaks of {core}","soul_urge":"Your Soul Urge is {n}: what you want underneath it all. It points to {core}","personality":"Your Personality number is {n}: the first impression you give. People often sense {core}","birthday":"Your Birthday number is {n}: a talent you carry. It adds {core}","maturity":"Your Maturity number is {n}: what increasingly emerges after your mid-thirties. It leans toward {core}"},"NAKSHATRA_INFO":{"Ashwini":[["initiative","curiosity"],"Deva","Horse","Swift, pioneering and restless; a natural starter with a healing or rescuing streak."],"Bharani":[["intensity","discipline"],"Manushya","Elephant","Carries heavy responsibility and strong appetites; transformation through endurance."],"Krittika":[["precision","radiance"],"Rakshasa","Sheep","Sharp, purifying and truthful; cuts through what is false, sometimes too bluntly."],"Rohini":[["empathy","steadiness"],"Manushya","Serpent","Magnetic, sensual and nurturing; grows beauty and security around itself."],"Mrigashira":[["curiosity","exploration"],"Deva","Serpent","The gentle seeker; restless curiosity and a lifelong search for something just out of reach."],"Ardra":[["intensity","curiosity"],"Manushya","Dog","Stormy, intellectual and renewing; clears the old through upheaval, then rebuilds."],"Punarvasu":[["exploration","empathy"],"Deva","Cat","Optimistic and returning; recovers well, restores hope and finds home again."],"Pushya":[["empathy","discipline"],"Deva","Sheep","Nourishing, dutiful and supportive; considered the most auspicious nakshatra for care and growth."],"Ashlesha":[["intensity","introspection"],"Rakshasa","Cat","Perceptive, strategic and magnetic; reads hidden motives and guards itself carefully."],"Magha":[["radiance","discipline"],"Rakshasa","Rat","Regal and tradition-minded; sense of lineage, dignity and responsibility to lead."],"Purva Phalguni":[["radiance","harmony"],"Manushya","Rat","Warm, creative and pleasure-loving; makes rest, play and affection a priority."],"Uttara Phalguni":[["steadiness","harmony"],"Manushya","Cow","Generous and dependable; builds lasting partnerships and helps others."],"Hasta":[["precision","curiosity"],"Deva","Buffalo","Skilful, witty and resourceful; good with the hands and with practical problem-solving."],"Chitra":[["precision","radiance"],"Rakshasa","Tiger","Artistic and design-minded; wants to craft something beautiful and distinctive."],"Swati":[["originality","harmony"],"Deva","Buffalo","Independent and adaptable like a plant swaying in wind; diplomatic and self-reliant."],"Vishakha":[["initiative","discipline"],"Rakshasa","Tiger","Single-minded and goal-driven; persists until the target is reached."],"Anuradha":[["harmony","discipline"],"Deva","Deer","Devoted, organised and friendship-oriented; succeeds through cooperation and loyalty."],"Jyeshtha":[["intensity","discipline"],"Rakshasa","Deer","Protective, senior and sharp-minded; carries responsibility and a strong sense of rank."],"Mula":[["introspection","intensity"],"Rakshasa","Dog","Root-seeking; wants the truth at the foundation and will uproot what is false."],"Purva Ashadha":[["exploration","radiance"],"Manushya","Monkey","Invincible optimism and persuasive energy; renews itself and inspires others."],"Uttara Ashadha":[["discipline","steadiness"],"Manushya","Mongoose","Principled and enduring; slow, lasting success through integrity."],"Shravana":[["curiosity","harmony"],"Deva","Monkey","Listener and learner; draws wisdom through hearing, connecting and passing on knowledge."],"Dhanishta":[["discipline","initiative"],"Rakshasa","Lion","Rhythmic, ambitious and resourceful; tends to build wealth and perform well in groups."],"Shatabhisha":[["introspection","originality"],"Rakshasa","Horse","The hundred healers; private, independent and drawn to unconventional knowledge."],"Purva Bhadrapada":[["intensity","originality"],"Manushya","Lion","Fiery idealist; transformative and intense, with a strong reformer's streak."],"Uttara Bhadrapada":[["introspection","empathy"],"Manushya","Cow","Deep, calm and compassionate; carries wisdom and steady spiritual depth."],"Revati":[["imagination","empathy"],"Deva","Elephant","Gentle guide and traveller; compassionate, imaginative and protective of those on the way."]},"MAHA_TEXT":{"Sun":"A period (6 years) that sharpens identity, authority and purpose. Questions of confidence, recognition, and your relationship with leaders and fathers come forward.","Moon":"A period (10 years) tuned to emotion, home, family and the public. Mood, sensitivity and sense of belonging are central; nurture routines and close ties.","Mars":"A period (7 years) of energy, action and ambition. Drive, competition and courage rise; channel the intensity into work and exercise, and mind your temper.","Rahu":"A period (18 years) of hunger, ambition and unconventional paths. Growth often comes through new environments, technology or foreign influences; stay grounded in values.","Jupiter":"A period (16 years) of expansion, learning and meaning. Education, teaching, mentors, family growth and opportunity are emphasised; avoid overconfidence.","Saturn":"A period (19 years) of structure, responsibility and slow mastery. Effort, patience and facing reality are rewarded; it favours long-term building over shortcuts.","Mercury":"A period (17 years) of learning, communication and commerce. Skills, trade, writing, networks and adaptability come forward.","Ketu":"A period (7 years) of detachment, simplification and inner search. Letting go, spiritual interest and unusual insight are emphasised; clarify what truly matters.","Venus":"A period (20 years) of relationships, creativity and comfort. Love, aesthetics, partnership and prosperity are emphasised; guard against indulgence."},"ANTAR_FLAVOR":{"Sun":"a sub-period focused on identity and recognition","Moon":"a sub-period focused on emotion and home","Mars":"a sub-period focused on action and effort","Rahu":"a sub-period of restlessness and ambition","Jupiter":"a sub-period of growth and guidance","Saturn":"a sub-period of discipline and responsibility","Mercury":"a sub-period of learning and communication","Ketu":"a sub-period of release and reflection","Venus":"a sub-period of relationships and enjoyment"},"SADE_SATI":{"rising":"Saturn is in the sign before your Moon sign (first phase of Saturn's roughly seven-and-a-half-year 'Sade Sati'). Traditionally a season of tightening priorities; practical pressure can ask you to simplify and take responsibility.","peak":"Saturn is crossing your Moon sign (the central phase of 'Sade Sati'). Traditionally a season of emotional maturing: heavier responsibilities, and a push to build real inner stability.","setting":"Saturn is in the sign after your Moon sign (the final phase of 'Sade Sati'). Traditionally a season of consolidation: lessons settle, and rebuilding becomes easier."},"YOGAS":{"Gaja Kesari":"Jupiter in a kendra (1st, 4th, 7th or 10th) from the Moon: traditionally linked with wisdom, good reputation and resilience.","Budha-Aditya":"Sun and Mercury in the same sign: traditionally linked with sharp intellect and communication.","Chandra-Mangala":"Moon and Mars together: traditionally linked with enterprise, drive and earning ability, with emotional intensity.","Ruchaka":"Mars strong in a kendra: courage, leadership and physical vitality.","Bhadra":"Mercury strong in a kendra: eloquence, intellect and business skill.","Hamsa":"Jupiter strong in a kendra: wisdom, ethics and a teacher's nature.","Malavya":"Venus strong in a kendra: charm, refinement, artistic and relational gifts.","Shasha":"Saturn strong in a kendra: discipline, endurance and the capacity to lead structures."},"PAIR_ASPECTS":{"Sun|Moon":{"conjunction":"Your Sun and Moon sit together: head and heart pull in the same direction. You are consistent and focused, though you may find it hard to see yourself from outside.","sextile":"Your Sun and Moon cooperate easily: what you want and what you need support one another with a little effort.","square":"Your Sun and Moon form a challenging angle: what you want and what you need pull against each other. It gives drive and inner friction; growth comes from honouring both.","trine":"Your Sun and Moon flow together: a natural inner harmony and ease in being yourself.","opposition":"Your Sun and Moon sit opposite one another (born near a full moon): you feel pulled between needs and goals, and learn balance through relationships and perspective."},"Venus|Mars":{"conjunction":"Venus and Mars are united in your chart: strong attraction, passion and a direct romantic style; desire and affection run together.","sextile":"Venus and Mars cooperate: affection and desire work together with natural charm.","square":"Venus and Mars are in tension: what you want and how you pursue it can clash, giving passion and some frustration; communicate desire plainly.","trine":"Venus and Mars flow: a natural ease in expressing affection and desire.","opposition":"Venus and Mars oppose: strong chemistry and polarity; you learn to balance giving with asserting."},"Moon|Saturn":{"conjunction":"Moon and Saturn together: emotional seriousness and self-reliance. You may have learned early to hold feelings in; warmth deepens with trust.","sextile":"Moon and Saturn cooperate: emotional steadiness and a capacity to cope.","square":"Moon and Saturn in tension: a tendency toward self-criticism or emotional restraint. Gentleness with yourself is the work.","trine":"Moon and Saturn flow: calm, mature emotional steadiness.","opposition":"Moon and Saturn oppose: you may feel torn between need for comfort and duty; learn to ask for support."},"Mercury|Mars":{"conjunction":"Mercury and Mars together: quick, forceful thinking and speech; debate energises you.","sextile":"Mercury and Mars cooperate: decisive, efficient thinking.","square":"Mercury and Mars in tension: sharp words and impatience; slow down before speaking.","trine":"Mercury and Mars flow: clear, courageous communication.","opposition":"Mercury and Mars oppose: arguing and debate come easily; choose your battles."}},"ELEMENT_TEXT":{"fire":{"dom":"Fire is strong in your chart: enthusiasm, courage and a need to act. Keep an eye on burnout and impatience.","low":"Fire is light in your chart: you may need to deliberately build confidence and initiative, since they won't always arrive on their own."},"earth":{"dom":"Earth is strong in your chart: you are practical, reliable and grounded. Watch for stubbornness or an over-focus on the material.","low":"Earth is light in your chart: grounding routines, body awareness and practical systems will help you make dreams real."},"air":{"dom":"Air is strong in your chart: you think, talk and connect easily. Watch for overthinking and for living in your head.","low":"Air is light in your chart: you may need to put feelings into words and seek outside perspective on purpose."},"water":{"dom":"Water is strong in your chart: you feel deeply and intuit well. Protect your boundaries and your energy.","low":"Water is light in your chart: you may need to slow down to notice feelings, and practise vulnerability."}},"MODALITY_TEXT":{"cardinal":{"dom":"Cardinal energy leads: you initiate and push things forward.","low":"Cardinal energy is light: starting things may take deliberate effort."},"fixed":{"dom":"Fixed energy leads: you persist and resist change.","low":"Fixed energy is light: staying with things to the end may take deliberate effort."},"mutable":{"dom":"Mutable energy leads: you adapt and change easily, and may find focus harder.","low":"Mutable energy is light: flexibility may take deliberate effort."}},"DISCLAIMER":"AstroBaba is for self-reflection and entertainment. Astrology and numerology are traditional symbolic systems, not scientific predictions, and nothing here is medical, legal, financial or relationship advice. Use what resonates, question what doesn't, and make your own decisions.","DIMENSION_TEXT":{"emotional":{"high":"You tend to understand each other's feelings without much effort, and emotional needs mesh well.","mid":"Your emotional styles differ but can meet in the middle; say what you need rather than expecting to be read.","low":"You process feelings very differently. Neither is wrong; agree on how you'll handle tension and give each other time to reset."},"communication":{"high":"Conversation flows: you follow each other's thinking and speak a similar language.","mid":"Communication works with a little translation; clarify assumptions and check understanding.","low":"Your thinking styles clash easily. Slow down, ask what was meant, and put important things in writing."},"values":{"high":"You value similar things in affection and enjoyment, so giving and receiving feel natural.","mid":"Your tastes and values differ in places; curiosity about each other's priorities goes a long way.","low":"What each of you values and finds enjoyable differs notably. Respect the difference, and agree on shared essentials."},"drive":{"high":"Your energies and motivations spark each other and you work well when doing things together.","mid":"Your pace and drive sometimes differ, so agree on how you decide and divide effort.","low":"Your drives pull in different directions and can create friction or competition. Define roles and take turns leading."},"stability":{"high":"There is a solid base for lasting trust and shared commitments.","mid":"Long-term fit is workable, but needs clear commitments and reliable habits.","low":"Building long-term stability will take deliberate effort: clear agreements, honest check-ins and patience."}},"DIMENSION_TITLE":{"emotional":"Emotional rapport","communication":"Communication","values":"Values & affection","drive":"Drive & energy","stability":"Long-term stability"},"RELATION_TIPS":{"romantic":["Say what you need directly rather than hoping it is guessed.","Schedule regular, unhurried time together without distractions.","When you disagree, begin with what you appreciate, then name the issue."],"business":["Put roles, decision rights and money rules in writing at the start.","Divide work by strengths: let each of you lead where your profile is strongest.","Agree how disagreements are resolved before they happen."],"family":["Accept that each of you processes feelings differently and don't take it personally.","Keep a few shared rituals, such as meals or calls, to maintain closeness.","Separate old roles from who you each are now."],"friends":["Make time for shared activities, not only conversation.","Be upfront when you need space so it isn't read as distance.","Celebrate each other's wins openly."]},"RELATION_TYPES":{"romantic":"Romantic partnership","business":"Business partnership","family":"Family bond","friends":"Friendship"},"EXTRA":{"STEMS":["Jia","Yi","Bing","Ding","Wu","Ji","Geng","Xin","Ren","Gui"],"BRANCHES":["Zi","Chou","Yin","Mao","Chen","Si","Wu","Wei","Shen","You","Xu","Hai"],"ANIMALS":["Rat","Ox","Tiger","Rabbit","Dragon","Snake","Horse","Goat","Monkey","Rooster","Dog","Pig"],"STEM_ELEMENT":["Wood","Wood","Fire","Fire","Earth","Earth","Metal","Metal","Water","Water"],"BRANCH_ELEMENT":["Water","Earth","Wood","Wood","Earth","Fire","Fire","Earth","Metal","Metal","Earth","Water"],"DAY_MASTER":{"Yang Wood":["The Great Tree","Upright, growth-minded and principled. You grow steadily toward your goals and stand firm in what you believe; you can be inflexible when challenged."],"Yin Wood":["The Vine and Flower","Flexible, gentle and resourceful. You reach your goals by adapting and cooperating, and you read people well; you can lose your own direction when pressured."],"Yang Fire":["The Sun","Warm, open and generous. You bring light and enthusiasm to a room and want to be seen; you can burn out or overextend."],"Yin Fire":["The Candle","Focused, perceptive and quietly warm. You light up a small circle intensely and notice what others miss; you can be sensitive and slow to forgive."],"Yang Earth":["The Mountain","Stable, dependable and protective. People lean on you and you rarely rush; you can be stubborn and slow to change."],"Yin Earth":["The Garden Soil","Nurturing, practical and receptive. You help things grow and absorb a lot from others; you can worry and take on too much."],"Yang Metal":["The Sword","Direct, decisive and just. You cut through confusion and defend what matters; you can be blunt or harsh."],"Yin Metal":["The Jewel","Refined, discerning and sensitive to quality. You care about beauty, standards and being valued; you can be self-critical and guarded."],"Yang Water":["The Ocean","Expansive, adaptable and far-seeing. You move toward wide horizons and connect many things; you can be restless or hard to pin down."],"Yin Water":["The Rain and Mist","Intuitive, subtle and imaginative. You sense currents beneath the surface and work around obstacles; you can doubt yourself and drift."]},"ANIMAL_TEXT":{"Rat":"Resourceful, quick and observant; an instinct for opportunity and survival.","Ox":"Patient, dependable and hardworking; slow, steady progress and strong principles.","Tiger":"Brave, spirited and independent; a natural challenger with a streak of the dramatic.","Rabbit":"Gentle, diplomatic and tasteful; peace-seeking with a sharp eye for people.","Dragon":"Confident, charismatic and ambitious; big ideas and a strong presence.","Snake":"Intuitive, private and strategic; deep thinking and quiet determination.","Horse":"Energetic, free-spirited and sociable; a need for movement, independence and variety.","Goat":"Gentle, artistic and empathetic; sensitive to atmosphere and in need of security.","Monkey":"Clever, playful and inventive; quick problem-solving and a love of novelty.","Rooster":"Meticulous, candid and hardworking; proud of standards and presentation.","Dog":"Loyal, honest and protective; a strong sense of justice and a faithful friend.","Pig":"Generous, warm and sincere; enjoys life and trusts easily."},"ELEMENT_BALANCE":{"Wood":{"dom":"Wood is abundant in your Four Pillars: growth, planning and drive for expansion. Watch for impatience and overreaching.","low":"Wood is scarce: you may need to deliberately cultivate vision, flexibility and a sense of growth."},"Fire":{"dom":"Fire is abundant: passion, enthusiasm and expressiveness. Watch for burnout and impulsiveness.","low":"Fire is scarce: warmth, joy and visibility may need conscious effort."},"Ea
