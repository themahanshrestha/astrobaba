# Netlify hosts the web front end; the Python API runs elsewhere (see DEPLOY.md).
# Netlify Functions cannot run this API: it needs Python with a compiled astronomy library.
[build]
  publish = "web"

# Proxy API calls to your backend. EDIT the two URLs below after deploying the backend (e.g. on Render).
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND.onrender.com/api/:splat"
  status = 200
  force = true

# index.html loads /static/...; on Netlify those files live at the site root.
[[redirects]]
  from = "/static/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
